<style>
.preview, .preview * { box-sizing: border-box; margin: 0; padding: 0; }
.preview {
  width: 1440px; height: 900px; position: relative; overflow: hidden;

  line-height: 1.5;
}
.preview a { color: inherit; text-decoration: none; }
.preview svg { display: block; }

/* NavBar */
.nav { position: relative; z-index: 40; flex-shrink: 0; background: #fff; border-bottom: 1px solid #DFEEE8; }
.nav-in { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; }
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; background: #2F8F6B; color: #fff;
  font: 700 13px/1 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -0.06em; }
.brand-text { line-height: 1.25; }
.brand-name { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; color: #18231F; }
.brand-sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11px; font-weight: 500; color: #5F7D70; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #3EBD80; }
.links { display: flex; align-items: center; gap: 4px; margin: 0 auto; }
.links a { padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; line-height: 20px; color: #5F7D70; }
.nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.seg { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 8px; background: #EEF6F1; }
.seg-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; color: #7C9B8D; }
.seg-btn svg { width: 16px; height: 16px; }
.on { background: #fff; color: #1F6B4F; box-shadow: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1); }
.btn { display: flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; line-height: 20px; }
.btn-ghost { font-weight: 500; color: #5F7D70; }
.btn-line { font-weight: 600; color: #1F6B4F; border: 1px solid #DFEEE8; }
.btn-solid { gap: 6px; padding: 0 14px; font-weight: 600; color: #fff; background: #2F8F6B; }
.btn-solid svg { width: 14px; height: 14px; }

/* Map area */
.main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #F4FBF8; }
.map { position: absolute; inset: 0; background: url(img/hyderabad-map-left.webp) no-repeat 0 0, url(img/hyderabad-map-right.webp) no-repeat 720px 0, #ddd; font-size: 12px; }

/* Floating filter bar */
.filters { position: absolute; left: 24px; right: 24px; top: 16px; z-index: 500; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid #DFEEE8; background: rgba(255,255,255,.95); box-shadow: 0 6px 20px rgba(24,35,31,.08);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.select { position: relative; display: flex; align-items: center; height: 40px; padding: 0 32px 0 36px; border-radius: 8px;
  border: 1px solid #DFEEE8; background: #fff; font-size: 13px; font-weight: 500; color: #18231F; }
.select .ico { position: absolute; left: 12px; width: 14px; height: 14px; color: #7C9B8D; }
.select .chev { position: absolute; right: 12px; width: 14px; height: 14px; color: #7C9B8D; }
.count { font-size: 13px; font-weight: 500; line-height: 20px; color: #5F7D70; }
.views { margin-left: auto; }
.view-btn { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px;
  font-size: 13px; font-weight: 500; line-height: 20px; color: #5F7D70; }
.view-btn.on { color: #1F6B4F; }
.view-btn svg { width: 14px; height: 14px; }

/* Markers (same geometry as MapView's divIcons) */
.pin { position: absolute; width: 34px; height: 40px; }
.pin svg { overflow: visible; }
.cluster { position: absolute; display: grid; place-items: center; border-radius: 9999px; background: rgba(47,143,107,.92); color: #fff;
  font: 700 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  box-shadow: 0 0 0 5px rgba(47,143,107,.22), 0 6px 16px rgba(24,35,31,.2); }

/* Leaflet controls */
.zoom { position: absolute; right: 18px; bottom: 35px; z-index: 800; width: 42px; border-radius: 16px; overflow: hidden;
  box-shadow: 0 16px 34px rgba(24,35,31,.16); }
.zoom a { display: block; width: 42px; height: 42px; line-height: 42px; text-align: center; background: rgba(255,255,255,.92);
  color: #18231f; font: 400 22px/42px "Lucida Console", Monaco, monospace; text-indent: 1px; }
.zoom a + a { border-top: 1px solid #dfebe6; line-height: 41px; }
.attrib { position: absolute; right: 0; bottom: 0; z-index: 800; padding: 0 5px; background: rgba(255,255,255,.8);
  color: #333; font-size: 12px; line-height: 1.4; }
.attrib a { color: #0078A8; }
.attrib svg { display: inline; vertical-align: baseline; width: 1em; height: .6669em; }
</style>
